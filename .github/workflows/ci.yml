name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          install: true
          install_args: go

      - name: Download modules
        run: mise x -- go mod download

      - name: Verify modules
        run: mise x -- go mod verify

      - name: Check go mod tidy
        run: |
          mise x -- go mod tidy
          (cd plancontract && mise x -- go mod tidy)
          (cd cmd/spanner-query-gen && mise x -- go mod tidy)
          (cd tools && mise x -- go mod tidy)
          # go.work.sum is intentionally untracked and ignored because
          # workspace download steps append entries to it on CI.
          git diff --exit-code -- go.mod go.sum plancontract/go.mod plancontract/go.sum cmd/spanner-query-gen/go.mod cmd/spanner-query-gen/go.sum tools/go.mod tools/go.sum

      - name: Verify OKF v0.2 conformance
        working-directory: tools
        run: mise x -- go run ./okf-check --repo-root .. --gate conformance

      - name: Verify spanalyzer OKF quality
        working-directory: tools
        run: mise x -- go run ./okf-check --repo-root .. --gate quality

      - name: Verify knowledge-bearing asset inventory
        working-directory: tools
        run: mise x -- go run ./okf-check --repo-root .. --gate assets

      - name: Verify generated plan-vocabulary catalog
        working-directory: tools
        run: mise x -- go run ./planvocab-gen --check

      - name: Vet
        run: mise x -- go vet ./...

      - name: Test
        run: mise x -- go test -race -shuffle=on ./...

      - name: Vet plancontract module
        working-directory: plancontract
        run: mise x -- go vet ./...

      - name: Test plancontract module
        working-directory: plancontract
        run: mise x -- go test -race -shuffle=on ./...

      - name: Vet cmd/spanner-query-gen module
        working-directory: cmd/spanner-query-gen
        run: mise x -- go vet ./...

      - name: Test cmd/spanner-query-gen module
        working-directory: cmd/spanner-query-gen
        run: mise x -- go test -race -shuffle=on ./...

      - name: Vet tools module
        working-directory: tools
        run: mise x -- go vet ./...

      - name: Test tools module
        working-directory: tools
        run: mise x -- go test -race -shuffle=on ./...

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          install: true
          install_args: go

      - name: Download modules
        run: mise x -- go mod download

      - name: Compile Spanner Omni integration test sources without running Omni
        working-directory: cmd/spanner-query-gen
        run: mise x -- go test -count=1 -tags='integration omni' -run '^$' ./...

      - name: Compile plan-probe Omni integration test sources without running Omni
        working-directory: tools
        run: mise x -- go test -count=1 -tags='integration omni' -run '^$' ./...

      - name: Run Spanner emulator integration tests
        working-directory: cmd/spanner-query-gen
        run: mise x -- go test -race -count=1 -tags=integration -run '^TestIntegration' ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          install: true
          install_args: go golangci-lint

      - name: Run golangci-lint
        run: mise x -- golangci-lint run --timeout=5m

      - name: Run golangci-lint on plancontract module
        working-directory: plancontract
        run: mise x -- golangci-lint run --timeout=5m

      - name: Run golangci-lint on cmd/spanner-query-gen module
        working-directory: cmd/spanner-query-gen
        run: mise x -- golangci-lint run --timeout=5m

      - name: Run golangci-lint on tools module
        working-directory: tools
        run: mise x -- golangci-lint run --timeout=5m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v4.0.1
        with:
          cache: true
          install: true
          install_args: go go:golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: mise x -- govulncheck ./...

      - name: Run govulncheck on plancontract module
        working-directory: plancontract
        run: mise x -- govulncheck ./...

      - name: Run govulncheck on cmd/spanner-query-gen module
        working-directory: cmd/spanner-query-gen
        run: mise x -- govulncheck ./...

      - name: Run govulncheck on tools module
        working-directory: tools
        run: mise x -- govulncheck ./...
