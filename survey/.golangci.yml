version: "2"

run:
  timeout: 5m

linters:
  enable:
    - modernize
    - revive
    - misspell
    - unconvert
  settings:
    modernize:
      # default behavior is to enable all checkers
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
