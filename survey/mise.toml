[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run all tests (starts in-process emulator)"
run = "go test ./..."

[tasks.test-drift-emulator]
description = "Run drift test against Cloud Spanner Emulator"
run = "go test -v -run TestDrift_EmulatorTableMetas ./infoschem"

[tasks.test-drift-omni]
description = "Run drift test against Spanner Omni"
run = "go test -v -run TestDrift_OmniTableMetas ./infoschem"

[tasks.test-drift-real]
description = "Required real-Spanner drift gate (fails unless TEST_REAL_SPANNER_DATABASE is configured)"
env = { REQUIRE_REAL_SPANNER_DRIFT = "1" }
run = "go test -v -run TestDrift_RealTableMetas ./infoschem"

[tasks.capture-infoschema-managed]
description = "Retain a point-in-time managed INFORMATION_SCHEMA capture"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture --target managed --write --repo-root .."

[tasks.check-infoschema-managed]
description = "Compare managed INFORMATION_SCHEMA with retained evidence without writing"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture check --target managed --repo-root .."

[tasks.capture-infoschema-emulator]
description = "Retain the pinned Emulator INFORMATION_SCHEMA capture"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture --target emulator --write --repo-root .."

[tasks.check-infoschema-emulator]
description = "Compare pinned Emulator INFORMATION_SCHEMA with retained evidence without writing"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture check --target emulator --repo-root .."

[tasks.capture-infoschema-omni]
description = "Retain the pinned Omni INFORMATION_SCHEMA capture"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture --target omni --write --repo-root .."

[tasks.check-infoschema-omni]
description = "Compare pinned Omni INFORMATION_SCHEMA with retained evidence without writing"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/infoschema-capture check --target omni --repo-root .."

[tasks.capture-spanner-sys-managed]
description = "Retain a provenance-complete point-in-time managed SPANNER_SYS capture"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/spanner-sys-capture --target managed --write --repo-root .."

[tasks.check-spanner-sys-managed]
description = "Compare managed SPANNER_SYS with retained evidence without writing"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/spanner-sys-capture check --target managed --repo-root .."

[tasks.capture-spanner-sys-omni]
description = "Retain the pinned Omni SPANNER_SYS capture with complete provenance"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/spanner-sys-capture --target omni --write --repo-root .."

[tasks.check-spanner-sys-omni]
description = "Compare pinned Omni SPANNER_SYS with retained evidence without writing"
env = { GOWORK = "off", GOFLAGS = "-mod=readonly" }
run = "go run ./cmd/spanner-sys-capture check --target omni --repo-root .."

[tasks.test-uuid-real]
description = "Managed-Spanner UUID metadata and reconstruction fixture"
env = { REQUIRE_REAL_SPANNER_UUID = "1" }
run = "go test -v -run TestUUID_RealSpanner ./infoschem"

[tasks.test-canonical-real]
description = "Read-only managed-Spanner canonical DDL aggregate comparison"
env = { REQUIRE_REAL_SPANNER_CANONICAL = "1" }
run = "go test -v -run TestCanonicalDDL_RealSpanner ./infoschem"

[tasks.test-expression-index-real]
description = "Cleanup-safe managed-Spanner expression-index metadata and syntax fixture"
env = { REQUIRE_REAL_SPANNER_EXPRESSION_INDEX = "1" }
run = "go test -v -run TestExpressionIndex_RealSpanner ./infoschem"

[tasks.test-managed-current]
description = "Run current managed-Spanner verification tests; mutation fixtures create collision-safe temporary objects and clean them up"
env = { REQUIRE_REAL_SPANNER_CANONICAL = "1", REQUIRE_REAL_SPANNER_DRIFT = "1", REQUIRE_REAL_SPANNER_EXPRESSION_INDEX = "1", REQUIRE_REAL_SPANNER_UUID = "1" }
run = "go test -count=1 -v -run 'Test(CanonicalDDL_RealSpanner|Drift_RealTableMetas|ExpressionIndex_RealSpanner|UUID_RealSpanner)$' ./infoschem"

[tasks.run-roundtrip]
description = "Run the roundtrip end-to-end demo"
run = "go run ./cmd/roundtrip"

[tools]
golangci-lint = "2.12.2"


[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test-all]
description = "Run the default local gate (lint, build, and tests; real-Spanner drift is a separate required gate)"
depends = ["lint", "build", "test"]
